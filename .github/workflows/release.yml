name: Release skill

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the skill
        run: zip -r i-am-choir-first-choir.zip i-am-choir-first-choir
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: i-am-choir-first-choir.zip
          generate_release_notes: true
